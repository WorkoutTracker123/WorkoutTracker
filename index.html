<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discipline Tracker</title>
    <style>
        /* ========== FONTS ========== */
        /* Using system fonts for offline functionality */

        /* ========== CSS VARIABLES (Theme System) ========== */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #151515;
            --bg-tertiary: #1f1f1f;
            --accent: #d4af37;
            --accent-dim: #8b7424;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-tertiary: #606060;
            --border: rgba(212, 175, 55, 0.2);
            --shadow: rgba(0, 0, 0, 0.5);
            --success: #4ade80;
            --danger: #ef4444;
            --overlay: rgba(0, 0, 0, 0.8);
        }

        /* ========== GLOBAL RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ========== LAYOUT STRUCTURE ========== */
        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 100;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-tertiary);
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .streak-display {
            margin-top: 16px;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .streak-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
            font-family: 'Courier New', Courier, monospace;
        }

        .streak-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }

        .weeks-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .week-item {
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
        }

        .week-item:hover {
            background: var(--bg-tertiary);
            border-color: var(--border);
        }

        .week-item.active {
            background: var(--accent);
            color: var(--bg-primary);
            font-weight: 600;
        }

        .week-name {
            font-size: 14px;
        }

        .week-progress {
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.7;
        }

        .week-item.active .week-progress {
            opacity: 1;
        }

        .add-week-btn {
            margin: 12px;
            padding: 14px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .add-week-btn:hover {
            background: var(--text-primary);
            transform: translateY(-1px);
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            position: relative;
        }

        .mobile-header {
            display: none;
            padding: 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .menu-toggle {
            width: 32px;
            height: 32px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 4px;
        }

        .menu-toggle span {
            width: 100%;
            height: 2px;
            background: var(--text-primary);
            transition: all 0.3s;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .week-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .controls-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 18px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent);
        }

        .btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* ========== CARD SECTIONS ========== */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 8px 32px var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        /* ========== MODE SELECTOR ========== */
        .mode-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .mode-btn {
            flex: 1;
            padding: 16px;
            border: 2px solid var(--border);
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .mode-btn:hover {
            border-color: var(--accent);
        }

        .mode-btn.active {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--bg-primary);
        }

        .mode-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .mode-desc {
            font-size: 12px;
            opacity: 0.7;
        }

        /* ========== EXERCISE BUILDER ========== */
        .exercises-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .exercise-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .exercise-item:hover {
            border-color: var(--border);
        }

        .exercise-input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'Outfit', sans-serif;
        }

        .exercise-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .remove-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            opacity: 0.8;
        }

        /* ========== WORKOUT GRID ========== */
        .workout-grid {
            display: grid;
            grid-template-columns: 200px repeat(6, 1fr);
            gap: 8px;
            margin-top: 16px;
        }

        .grid-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            font-weight: 600;
            padding: 8px;
            text-align: center;
        }

        .exercise-label {
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .checkbox-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .custom-checkbox {
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .custom-checkbox:hover {
            border-color: var(--accent);
        }

        .custom-checkbox.checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .custom-checkbox.checked::after {
            content: '✓';
            color: var(--bg-primary);
            font-weight: bold;
            font-size: 18px;
        }

        /* ========== PROGRESS BAR ========== */
        .progress-section {
            margin-top: 24px;
        }

        .progress-bar-container {
            height: 24px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-dim), var(--accent));
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
        }

        .progress-percentage {
            font-size: 12px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: var(--bg-primary);
        }

        .perfect-week-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 16px;
            background: var(--success);
            color: var(--bg-primary);
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ========== PROGRESS PHOTOS ========== */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .photo-upload {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            aspect-ratio: 3/4;
        }

        .photo-upload:hover {
            border-color: var(--accent);
        }

        .photo-upload input {
            display: none;
        }

        .photo-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .photo-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            position: relative;
            z-index: 1;
        }

        /* ========== CHART ========== */
        .chart-container {
            width: 100%;
            height: 300px;
            position: relative;
        }

        #progressChart {
            width: 100%;
            height: 100%;
        }

        /* ========== TIMER ========== */
        .timer-display {
            font-size: 48px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            text-align: center;
            margin: 20px 0;
        }

        .timer-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        /* ========== THEME PICKER ========== */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .theme-option {
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            background: var(--bg-tertiary);
        }

        .theme-option:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .theme-option.active {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--bg-primary);
        }

        .theme-preview {
            width: 100%;
            height: 40px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .theme-name {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ========== MODAL ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-tertiary);
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 200;
            }

            .mobile-header {
                display: flex;
            }

            .main-content {
                padding: 16px;
            }

            .workout-grid {
                grid-template-columns: 120px repeat(6, 1fr);
                gap: 4px;
                font-size: 11px;
            }

            .custom-checkbox {
                width: 24px;
                height: 24px;
            }

            .card {
                padding: 16px;
            }

            .week-title {
                font-size: 20px;
            }

            .timer-display {
                font-size: 36px;
            }
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">Discipline</div>
                <div class="streak-display">
                    <div class="streak-number" id="streakNumber">0</div>
                    <div class="streak-label">Day Streak</div>
                </div>
            </div>
            <div class="weeks-list" id="weeksList"></div>
            <button class="add-week-btn" onclick="addWeek()">+ New Week</button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="mobile-header">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="logo">Discipline</div>
            </div>

            <div class="top-controls">
                <h1 class="week-title" id="weekTitle">Week 1</h1>
                <div class="controls-group">
                    <button class="btn" onclick="openModal('renameModal')">Rename</button>
                    <button class="btn" onclick="deleteWeek()">Delete Week</button>
                    <button class="btn" onclick="openModal('themeModal')">Themes</button>
                    <button class="btn" onclick="openModal('settingsModal')">Settings</button>
                </div>
            </div>

            <!-- MODE SELECTOR -->
            <div class="card">
                <div class="mode-selector">
                    <div class="mode-btn active" id="customModeBtn" onclick="setMode('custom')">
                        <div class="mode-title">Custom Builder</div>
                        <div class="mode-desc">Define your own exercises</div>
                    </div>
                    <div class="mode-btn" id="rotatingModeBtn" onclick="setMode('rotating')">
                        <div class="mode-title">Rotating Program</div>
                        <div class="mode-desc">Push / Pull / Legs split</div>
                    </div>
                </div>
            </div>

            <!-- CUSTOM MODE EXERCISES -->
            <div class="card" id="customExercisesCard">
                <div class="card-header">
                    <div class="card-title">Exercise Builder</div>
                    <button class="btn" onclick="addExercise()">+ Add Exercise</button>
                </div>
                <div class="exercises-list" id="exercisesList"></div>
            </div>

            <!-- WORKOUT TRACKING -->
            <div class="card">
                <div class="card-title">Weekly Training</div>
                <div id="workoutGrid"></div>
                <div class="progress-section">
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="progressBar" style="width: 0%">
                            <span class="progress-percentage" id="progressPercentage">0%</span>
                        </div>
                    </div>
                    <div id="perfectBadge"></div>
                </div>
            </div>

            <!-- TIMER -->
            <div class="card">
                <div class="card-title">Workout Timer</div>
                <div class="timer-display" id="timerDisplay">00:00:00</div>
                <div class="timer-controls">
                    <button class="btn" onclick="startTimer()">Start</button>
                    <button class="btn" onclick="stopTimer()">Stop</button>
                    <button class="btn" onclick="resetTimer()">Reset</button>
                </div>
            </div>

            <!-- PROGRESS PHOTOS -->
            <div class="card">
                <div class="card-title">Progress Photos</div>
                <div class="photo-grid">
                    <div class="photo-upload" onclick="document.getElementById('frontPhoto').click()">
                        <input type="file" id="frontPhoto" accept="image/*" onchange="uploadPhoto('front', this)">
                        <img id="frontPreview" class="photo-preview" style="display: none;">
                        <div class="photo-label">Front</div>
                    </div>
                    <div class="photo-upload" onclick="document.getElementById('sidePhoto').click()">
                        <input type="file" id="sidePhoto" accept="image/*" onchange="uploadPhoto('side', this)">
                        <img id="sidePreview" class="photo-preview" style="display: none;">
                        <div class="photo-label">Side</div>
                    </div>
                    <div class="photo-upload" onclick="document.getElementById('backPhoto').click()">
                        <input type="file" id="backPhoto" accept="image/*" onchange="uploadPhoto('back', this)">
                        <img id="backPreview" class="photo-preview" style="display: none;">
                        <div class="photo-label">Back</div>
                    </div>
                </div>
            </div>

            <!-- 90-DAY CHART -->
            <div class="card">
                <div class="card-title">90-Day Progress</div>
                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <!-- RENAME MODAL -->
    <div class="modal" id="renameModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('renameModal')">&times;</span>
            <div class="modal-header">Rename Week</div>
            <input type="text" class="exercise-input" id="renameInput" placeholder="Enter new name" style="width: 100%; margin-bottom: 16px;">
            <button class="btn active" onclick="renameWeek()" style="width: 100%;">Save</button>
        </div>
    </div>

    <!-- THEME MODAL -->
    <div class="modal" id="themeModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('themeModal')">&times;</span>
            <div class="modal-header">Choose Theme</div>
            <div class="theme-grid" id="themeGrid"></div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('settingsModal')">&times;</span>
            <div class="modal-header">Settings</div>
            <div style="margin-bottom: 16px;">
                <label style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
                    <input type="checkbox" id="soundToggle" onchange="toggleSound()" style="width: 20px; height: 20px;">
                    <span>Enable sound effects</span>
                </label>
            </div>
            <button class="btn" onclick="exportData()" style="width: 100%; margin-bottom: 8px;">Export Data</button>
            <button class="btn" onclick="document.getElementById('importFile').click()" style="width: 100%;">Import Data</button>
            <input type="file" id="importFile" accept=".json" onchange="importData(this)" style="display: none;">
        </div>
    </div>

    <script>
        // Test that JavaScript is working
        console.log('JavaScript is running!');
        
        // ========== STATE MANAGEMENT ==========
        let state = {
            weeks: [],
            currentWeekIndex: 0,
            streak: 0,
            soundEnabled: true,
            currentTheme: 'blackGold',
            weekHistory: []
        };

        // ========== THEMES ==========
        const themes = {
            blackGold: {
                name: 'Black & Gold',
                vars: {
                    '--bg-primary': '#0a0a0a',
                    '--bg-secondary': '#151515',
                    '--bg-tertiary': '#1f1f1f',
                    '--accent': '#d4af37',
                    '--accent-dim': '#8b7424',
                    '--text-primary': '#ffffff',
                    '--text-secondary': '#a0a0a0',
                    '--text-tertiary': '#606060',
                    '--border': 'rgba(212, 175, 55, 0.2)',
                }
            },
            blackRed: {
                name: 'Black & Red',
                vars: {
                    '--bg-primary': '#0f0f0f',
                    '--bg-secondary': '#1a1a1a',
                    '--bg-tertiary': '#252525',
                    '--accent': '#dc2626',
                    '--accent-dim': '#991b1b',
                    '--text-primary': '#ffffff',
                    '--text-secondary': '#a0a0a0',
                    '--text-tertiary': '#606060',
                    '--border': 'rgba(220, 38, 38, 0.2)',
                }
            },
            cyanDark: {
                name: 'Dark Blue & Cyan',
                vars: {
                    '--bg-primary': '#0c1821',
                    '--bg-secondary': '#1b2838',
                    '--bg-tertiary': '#253447',
                    '--accent': '#00d4ff',
                    '--accent-dim': '#0088cc',
                    '--text-primary': '#e0f2ff',
                    '--text-secondary': '#94b8d4',
                    '--text-tertiary': '#5a7890',

                }
            },
            midnight: {

                vars: {

                    '--accent': '#818cf8',
                    '--accent-dim': '#6366f1',
                    '--text-primary': '#f1f5f9',

                    '--text-tertiary': '#94a3b8',
                    '--border': 'rgba(129, 140, 248, 0.2)',
                }

        // ========== ROTATING PROGRAM EXERCISES ==========
        const rotatingProgram = {
            push: ['Bench Press', 'Overhead Press', 'Incline Dumbbell Press', 'Lateral Raises', 'Tricep Dips', 'Cable Flyes'],
            pull: ['Deadlift', 'Pull-ups', 'Barbell Rows', 'Face Pulls', 'Barbell Curls', 'Hammer Curls'],
            legs: ['Squats', 'Romanian Deadlift', 'Leg Press', 'Leg Curls', 'Calf Raises', 'Bulgarian Split Squats']
        };

        // ========== TIMER ==========
        let timerInterval = null;
        let timerSeconds = 0;

        // ========== INITIALIZATION ==========
        function init() {
            loadState();
            renderThemeGrid();
            applyTheme(state.currentTheme);
            if (state.weeks.length === 0) {
                addWeek();
            }
            renderWeeksList();
            renderCurrentWeek();
            updateStreak();
            renderChart();
            document.getElementById('soundToggle').checked = state.soundEnabled;
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('disciplineTracker');
                if (saved) {
                    state = JSON.parse(saved);
                }
            } catch (e) {
                console.warn('localStorage not available:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem('disciplineTracker', JSON.stringify(state));
            } catch (e) {
                console.warn('Cannot save to localStorage:', e);
            }
        }

        // ========== WEEK MANAGEMENT ==========
        function addWeek() {
            const weekNumber = state.weeks.length + 1;
            const newWeek = {
                id: Date.now(),
                name: `Week ${weekNumber}`,
                mode: 'custom',
                exercises: [],
                tracking: {},
                photos: {},
                completionPercentage: 0
            };
            state.weeks.push(newWeek);
            state.currentWeekIndex = state.weeks.length - 1;
            saveState();
            renderWeeksList();
            renderCurrentWeek();
        }

        function deleteWeek() {
            if (state.weeks.length === 1) {
                alert('Cannot delete the last week');
                return;
            }
            if (confirm('Delete this week?')) {
                state.weeks.splice(state.currentWeekIndex, 1);
                state.currentWeekIndex = Math.max(0, state.currentWeekIndex - 1);
                saveState();
                renderWeeksList();
                renderCurrentWeek();
            }
        }

        function switchWeek(index) {
            state.currentWeekIndex = index;
            saveState();
            renderWeeksList();
            renderCurrentWeek();
        }

        function renameWeek() {
            const newName = document.getElementById('renameInput').value.trim();
            if (newName) {
                state.weeks[state.currentWeekIndex].name = newName;
                saveState();
                renderWeeksList();
                renderCurrentWeek();
                closeModal('renameModal');
            }
        }

        function renderWeeksList() {
            const container = document.getElementById('weeksList');
            container.innerHTML = state.weeks.map((week, index) => `
                <div class="week-item ${index === state.currentWeekIndex ? 'active' : ''}" onclick="switchWeek(${index})">
                    <span class="week-name">${week.name}</span>
                    <span class="week-progress">${week.completionPercentage}%</span>
                </div>
            `).join('');
        }

        // ========== MODE MANAGEMENT ==========
        function setMode(mode) {
            const currentWeek = state.weeks[state.currentWeekIndex];
            currentWeek.mode = mode;
            
            if (mode === 'rotating') {
                const weekIndex = state.currentWeekIndex % 3;
                const splits = ['push', 'pull', 'legs'];
                currentWeek.exercises = rotatingProgram[splits[weekIndex]];
            }
            
            saveState();
            renderCurrentWeek();
        }

        // ========== EXERCISE MANAGEMENT ==========
        function addExercise() {
            const currentWeek = state.weeks[state.currentWeekIndex];
            if (currentWeek.exercises.length >= 12) {
                alert('Maximum 12 exercises per week');
                return;
            }
            currentWeek.exercises.push('');
            saveState();
            renderExercisesList();
        }

        function updateExercise(index, value) {
            state.weeks[state.currentWeekIndex].exercises[index] = value;
            saveState();
            renderWorkoutGrid();
        }

        function removeExercise(index) {
            state.weeks[state.currentWeekIndex].exercises.splice(index, 1);
            saveState();
            renderExercisesList();
            renderWorkoutGrid();
        }

        function renderExercisesList() {
            const currentWeek = state.weeks[state.currentWeekIndex];
            const container = document.getElementById('exercisesList');
            container.innerHTML = currentWeek.exercises.map((exercise, index) => `
                <div class="exercise-item">
                    <input type="text" class="exercise-input" value="${exercise}" 
                        onchange="updateExercise(${index}, this.value)" 
                        placeholder="Exercise name">
                    <button class="remove-btn" onclick="removeExercise(${index})">Remove</button>
                </div>
            `).join('');
        }

        // ========== WORKOUT TRACKING ==========
        function renderWorkoutGrid() {
            const currentWeek = state.weeks[state.currentWeekIndex];
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            let html = '<div class="workout-grid">';
            html += '<div class="grid-header">Exercise</div>';
            days.forEach(day => {
                html += `<div class="grid-header">${day}</div>`;
            });
            
            currentWeek.exercises.forEach((exercise, exIndex) => {
                html += `<div class="exercise-label">${exercise || 'Unnamed'}</div>`;
                days.forEach((day, dayIndex) => {
                    const key = `${exIndex}-${dayIndex}`;
                    const checked = currentWeek.tracking[key] || false;
                    html += `
                        <div class="checkbox-cell">
                            <div class="custom-checkbox ${checked ? 'checked' : ''}" 
                                onclick="toggleCheckbox(${exIndex}, ${dayIndex})"></div>
                        </div>
                    `;
                });
            });
            
            html += '</div>';
            document.getElementById('workoutGrid').innerHTML = html;
            updateProgress();
        }

        function toggleCheckbox(exIndex, dayIndex) {
            const currentWeek = state.weeks[state.currentWeekIndex];
            const key = `${exIndex}-${dayIndex}`;
            currentWeek.tracking[key] = !currentWeek.tracking[key];
            
            if (state.soundEnabled) {
                playClickSound();
            }
            
            saveState();
            renderWorkoutGrid();
        }

        function updateProgress() {
            const currentWeek = state.weeks[state.currentWeekIndex];
            const totalCheckboxes = currentWeek.exercises.length * 6;
            if (totalCheckboxes === 0) {
                currentWeek.completionPercentage = 0;
            } else {
                const checked = Object.values(currentWeek.tracking).filter(v => v).length;
                currentWeek.completionPercentage = Math.round((checked / totalCheckboxes) * 100);
            }
            
            const bar = document.getElementById('progressBar');
            const percentage = document.getElementById('progressPercentage');
            const badge = document.getElementById('perfectBadge');
            
            bar.style.width = currentWeek.completionPercentage + '%';
            percentage.textContent = currentWeek.completionPercentage + '%';
            
            if (currentWeek.completionPercentage === 100) {
                badge.innerHTML = '<div class="perfect-week-badge">🏆 PERFECT WEEK</div>';
                updateWeekHistory();
            } else {
                badge.innerHTML = '';
            }
            
            saveState();
            renderWeeksList();
            renderChart();
        }

        function updateWeekHistory() {
            const currentWeek = state.weeks[state.currentWeekIndex];
            const weekId = currentWeek.id;
            
            if (!state.weekHistory) {
                state.weekHistory = [];
            }
            
            const existingIndex = state.weekHistory.findIndex(w => w.weekId === weekId);
            if (existingIndex === -1 && currentWeek.completionPercentage === 100) {
                state.weekHistory.push({
                    weekId: weekId,
                    completedDate: new Date().toISOString(),
                    percentage: 100
                });
            }
            
            updateStreak();
            saveState();
        }

        function updateStreak() {
            const completedWeeks = state.weekHistory || [];
            
            // Sort by date
            completedWeeks.sort((a, b) => new Date(a.completedDate) - new Date(b.completedDate));
            
            let streak = 0;
            const today = new Date();
            
            // Count consecutive weeks
            for (let i = completedWeeks.length - 1; i >= 0; i--) {
                const weekDate = new Date(completedWeeks[i].completedDate);
                const daysDiff = Math.floor((today - weekDate) / (1000 * 60 * 60 * 24));
                
                if (daysDiff <= 7 * (streak + 1)) {
                    streak++;
                } else {
                    break;
                }
            }
            
            state.streak = streak;
            document.getElementById('streakNumber').textContent = state.streak;
            saveState();
        }

        // ========== CURRENT WEEK RENDER ==========
        function renderCurrentWeek() {
            const currentWeek = state.weeks[state.currentWeekIndex];
            document.getElementById('weekTitle').textContent = currentWeek.name;
            document.getElementById('renameInput').value = currentWeek.name;
            
            // Update mode buttons
            document.getElementById('customModeBtn').classList.toggle('active', currentWeek.mode === 'custom');
            document.getElementById('rotatingModeBtn').classList.toggle('active', currentWeek.mode === 'rotating');
            
            // Show/hide custom exercises card
            document.getElementById('customExercisesCard').style.display = 
                currentWeek.mode === 'custom' ? 'block' : 'none';
            
            renderExercisesList();
            renderWorkoutGrid();
            renderPhotos();
        }

        // ========== PHOTOS ==========
        function uploadPhoto(type, input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxSize = 800;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height && width > maxSize) {
                        height *= maxSize / width;
                        width = maxSize;
                    } else if (height > maxSize) {
                        width *= maxSize / height;
                        height = maxSize;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressed = canvas.toDataURL('image/jpeg', 0.8);
                    state.weeks[state.currentWeekIndex].photos[type] = compressed;
                    saveState();
                    renderPhotos();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderPhotos() {
            const currentWeek = state.weeks[state.currentWeekIndex];
            ['front', 'side', 'back'].forEach(type => {
                const preview = document.getElementById(type + 'Preview');
                if (currentWeek.photos && currentWeek.photos[type]) {
                    preview.src = currentWeek.photos[type];
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }
            });
        }

        // ========== CHART ==========
        function renderChart() {
            const canvas = document.getElementById('progressChart');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            const width = canvas.width;
            const height = canvas.height;
            const padding = 40;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Get last 13 weeks (90 days ≈ 13 weeks)
            const dataPoints = state.weeks.slice(-13).map(w => w.completionPercentage);
            
            if (dataPoints.length === 0) return;
            
            // Draw axes
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border');
            ctx.lineWidth = 1;
            
            // Y-axis
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(padding, height - padding);
            ctx.lineTo(width - padding, height - padding);
            ctx.stroke();
            
            // Y-axis labels
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-tertiary');
            ctx.font = '11px JetBrains Mono';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 100; i += 25) {
                const y = height - padding - (i / 100) * (height - 2 * padding);
                ctx.fillText(i + '%', padding - 10, y + 4);
            }
            
            // Draw line
            if (dataPoints.length > 1) {
                const stepX = (width - 2 * padding) / (dataPoints.length - 1);
                
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
                ctx.lineWidth = 3;
                ctx.beginPath();
                
                dataPoints.forEach((point, index) => {
                    const x = padding + index * stepX;
                    const y = height - padding - (point / 100) * (height - 2 * padding);
                    
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                
                ctx.stroke();
                
                // Draw points
                ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent');
                dataPoints.forEach((point, index) => {
                    const x = padding + index * stepX;
                    const y = height - padding - (point / 100) * (height - 2 * padding);
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // ========== TIMER ==========
        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function resetTimer() {
            stopTimer();
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timerSeconds / 3600);
            const minutes = Math.floor((timerSeconds % 3600) / 60);
            const seconds = timerSeconds % 60;
            
            const display = [hours, minutes, seconds]
                .map(n => n.toString().padStart(2, '0'))
                .join(':');
            
            document.getElementById('timerDisplay').textContent = display;
        }

        // ========== THEMES ==========
        function renderThemeGrid() {
            const container = document.getElementById('themeGrid');
            container.innerHTML = Object.keys(themes).map(key => {
                const theme = themes[key];
                const isActive = key === state.currentTheme;
                return `
                    <div class="theme-option ${isActive ? 'active' : ''}" onclick="applyTheme('${key}')">
                        <div class="theme-preview" style="background: ${theme.vars['--accent']}"></div>
                        <div class="theme-name">${theme.name}</div>
                    </div>
                `;
            }).join('');
        }

        function applyTheme(themeKey) {
            const theme = themes[themeKey];
            const root = document.documentElement;
            
            Object.keys(theme.vars).forEach(varName => {
                root.style.setProperty(varName, theme.vars[varName]);
            });
            
            state.currentTheme = themeKey;
            saveState();
            renderThemeGrid();
            renderChart();
        }

        // ========== SOUND ==========
        function toggleSound() {
            state.soundEnabled = document.getElementById('soundToggle').checked;
            saveState();
        }

        function playClickSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // ========== IMPORT/EXPORT ==========
        function exportData() {
            const dataStr = JSON.stringify(state, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'discipline-tracker-backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    state = imported;
                    saveState();
                    init();
                    alert('Data imported successfully!');
                } catch (error) {
                    alert('Error importing data. Please check the file format.');
                }
            };
            reader.readAsText(file);
        }

        // ========== MODALS ==========
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // ========== SIDEBAR TOGGLE ==========
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        // ========== START APP ==========
        init();

        // Re-render chart on window resize
        window.addEventListener('resize', () => {
            renderChart();
        });
    </script>
